<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>上课提醒</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <aside id="sidebar">
      <h1 class="app-title">上课提醒</h1>
      <nav class="nav">
        <button id="nav-profiles" class="nav-item active" type="button">档案</button>
        <button id="nav-rooms" class="nav-item" type="button">教室</button>
      </nav>
      <div class="sidebar-data">
        <button id="btn-export" class="nav-item" type="button">导出数据</button>
        <button id="btn-import" class="nav-item" type="button">导入数据</button>
      </div>
      <footer class="site-footer">
        <div class="footer-links">
          <a href="https://github.com/yangkai3129-dev/class-reminder" target="_blank" rel="noopener">项目主页</a>
          <a href="https://github.com/yangkai3129-dev/class-reminder/releases/latest" target="_blank" rel="noopener">下载最新版</a>
          <a href="https://github.com/yangkai3129-dev/class-reminder/blob/main/LICENSE" target="_blank" rel="noopener">MIT 协议</a>
        </div>
        <p class="footer-copy">© 2026 上课提醒 · 开源项目</p>
      </footer>
    </aside>
    <input id="import-file" type="file" accept=".json,application/json" hidden>
    <input id="schedule-file" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
    <main id="content">
      <section id="profiles-view" class="view">
        <header class="view-header">
          <div class="title-group">
            <h2 id="profiles-title" class="view-title">档案</h2>
            <div id="profile-view-toggle" class="segmented" role="tablist">
              <button class="seg-tab" data-view="card" type="button" role="tab">卡片</button>
              <button class="seg-tab active" data-view="list" type="button" role="tab">列表</button>
            </div>
          </div>
          <div class="header-controls">
            <input id="profile-search" class="search-input" type="text" placeholder="搜索学生姓名">
            <button id="btn-import-schedule" class="btn btn-primary" type="button">导入课表</button>
            <button id="btn-new-profile" class="btn btn-secondary" type="button">新建档案</button>
          </div>
        </header>
        <div id="schedule-status" class="schedule-status" hidden>
          <span id="schedule-status-text"></span>
          <button id="btn-clear-schedule" class="schedule-clear" type="button">清除</button>
        </div>
        <div id="profile-list" class="list"></div>
        <div id="profile-grid" class="profile-grid" hidden></div>
        <div id="profiles-empty" class="empty" hidden>
          <h3 class="empty-title">还没有学生档案</h3>
          <p class="empty-body">点「新建档案」，输入学生/班级名称和提醒模板，建好第一份档案。</p>
        </div>
      </section>

      <section id="rooms-view" class="view" hidden>
        <header class="view-header">
          <h2 id="rooms-title" class="view-title">教室</h2>
          <div class="header-controls">
            <button id="btn-manage-rooms" class="btn btn-secondary btn-manage" type="button">管理</button>
            <button id="btn-new-room" class="btn btn-primary" type="button">添加教室</button>
          </div>
        </header>
        <div id="room-category-tabs" class="segmented" role="tablist">
          <button class="seg-tab active" data-category="class" type="button" role="tab">班课教室</button>
          <button class="seg-tab" data-category="vip" type="button" role="tab">VIP教室</button>
        </div>
        <div id="room-grid" class="room-grid"></div>
        <div id="rooms-empty" class="empty" hidden>
          <h3 class="empty-title">还没有教室号</h3>
          <p class="empty-body">点「添加教室」，按「班课教室」或「VIP教室」分类加入第一个教室号。</p>
        </div>
      </section>

      <section id="fill-view" class="view" hidden>
        <header class="view-header">
          <button id="btn-fill-back" class="link-action" type="button">‹ 档案</button>
          <div id="fill-mode-toggle" class="segmented">
            <button class="seg-tab active" data-mode="picker" type="button">点选/滚轮</button>
            <button class="seg-tab" data-mode="direct" type="button">直接输入</button>
          </div>
        </header>
        <h2 id="fill-title" class="view-title"></h2>
        <p id="fill-schedule-note" class="hint" hidden></p>
        <p id="fill-error" class="error" hidden></p>
        <div id="fill-fields" class="fill-fields"></div>
        <p id="fill-hint" class="hint">点「确认」保存这三个值，下次打开该学生会自动带出。</p>
        <div class="fill-footer">
          <button id="btn-fill-confirm" class="btn btn-primary" type="button">确认</button>
        </div>
      </section>
    </main>
  </div>

  <!-- 档案编辑器（创建/编辑） -->
  <div id="profile-editor" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="profile-editor-title">
      <h2 id="profile-editor-title" class="modal-title">新建档案</h2>
      <div class="field">
        <label class="label" for="profile-name">学生/班级名称</label>
        <input id="profile-name" class="input" type="text" placeholder="例如：张三 · 海生2册">
      </div>
      <div class="field">
        <label class="label">固定头（标题 + 教室安排 + 时间安排）</label>
        <textarea id="editor-header" class="input" rows="3"></textarea>
      </div>
      <div class="field">
        <label class="label">课节模板</label>
        <div class="composer-toolbar">
          <button class="chip-btn" data-token="{时间}" type="button">{时间}</button>
          <button class="chip-btn" data-token="{教室号}" type="button">{教室号}</button>
          <button class="chip-btn" data-token="{教师}" type="button">{教师}</button>
        </div>
        <div id="editor-slot-tabs" class="segmented">
          <button class="seg-tab active" data-slot="0" type="button">第1节</button>
          <button class="seg-tab" data-slot="1" type="button">第2节</button>
          <button class="seg-tab" data-slot="2" type="button">第3节</button>
        </div>
        <textarea id="editor-slot-0" class="input" rows="2"></textarea>
        <textarea id="editor-slot-1" class="input" rows="2" hidden></textarea>
        <textarea id="editor-slot-2" class="input" rows="2" hidden></textarea>
        <p class="hint">每节一行模板，如「{时间} @{教师}」；没课的节留空即可。</p>
      </div>
      <div class="field">
        <label class="label">固定尾</label>
        <textarea id="editor-footer" class="input" rows="2"></textarea>
      </div>
      <div id="editor-error" class="error" hidden></div>
      <div class="modal-actions">
        <button id="btn-editor-cancel" class="btn btn-secondary" type="button">放弃创建</button>
        <button id="btn-editor-confirm" class="btn btn-primary" type="button">创建档案</button>
      </div>
    </div>
  </div>

  <!-- 教室编辑器（添加/编辑） -->
  <div id="room-editor" class="modal-backdrop" hidden>
    <div class="modal modal-narrow" role="dialog" aria-modal="true" aria-labelledby="room-editor-title">
      <h2 id="room-editor-title" class="modal-title">添加教室</h2>
      <div class="field">
        <label class="label" for="room-number">教室号</label>
        <input id="room-number" class="input" type="text" placeholder="例如：2802">
      </div>
      <div class="field">
        <label class="label">类型</label>
        <div id="room-editor-tabs" class="segmented">
          <button class="seg-tab active" data-category="class" type="button">班课教室</button>
          <button class="seg-tab" data-category="vip" type="button">VIP教室</button>
        </div>
      </div>
      <div id="room-editor-error" class="error" hidden></div>
      <div class="modal-actions">
        <button id="btn-room-cancel" class="btn btn-secondary" type="button">放弃添加</button>
        <button id="btn-room-confirm" class="btn btn-primary" type="button">保存教室</button>
      </div>
    </div>
  </div>

  <!-- 删除确认 -->
  <div id="confirm-modal" class="modal-backdrop" hidden>
    <div class="modal modal-narrow" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <h2 id="confirm-title" class="modal-title">删除档案</h2>
      <p id="confirm-body" class="confirm-body"></p>
      <div class="modal-actions">
        <button id="btn-confirm-cancel" class="btn btn-secondary" type="button">否</button>
        <button id="btn-confirm-delete" class="btn btn-primary" type="button">是</button>
      </div>
    </div>
  </div>

  <!-- 核对弹窗（确认 → 只读预览 → 修改/确认复制） -->
  <div id="copy-modal" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="copy-modal-title">
      <h2 id="copy-modal-title" class="modal-title"></h2>
      <textarea id="copy-preview" class="copy-preview"></textarea>
      <p id="copy-status" class="copy-status" hidden></p>
      <div class="modal-actions">
        <button id="btn-copy-back" class="btn btn-secondary" type="button">取消</button>
        <button id="btn-copy-confirm" class="btn btn-primary" type="button">确认复制</button>
      </div>
    </div>
  </div>

  <!-- 导入课表弹窗（三段：选日期 → 导入中 → 结果） -->
  <div id="schedule-modal" class="modal-backdrop" hidden>
    <div class="modal modal-narrow" role="dialog" aria-modal="true" aria-labelledby="schedule-modal-title">
      <h2 id="schedule-modal-title" class="modal-title">导入课表</h2>

      <div id="schedule-stage-pick">
        <div class="field">
          <label class="label" for="schedule-date">课表日期</label>
          <div class="schedule-date-wrap">
            <button id="schedule-date-box" class="schedule-date-box" type="button">
              <span id="schedule-date-display"></span><span id="schedule-date-label" class="schedule-date-label"></span>
            </button>
            <input id="schedule-date" class="schedule-date-input" type="date">
          </div>
        </div>
        <p class="hint">如需导入明日课表，请等待课表发布后再导入。</p>
        <p id="schedule-modal-error" class="error" hidden></p>
        <div class="modal-actions">
          <button id="btn-schedule-cancel" class="btn btn-secondary" type="button">取消</button>
          <button id="btn-schedule-confirm" class="btn btn-primary" type="button">确认导入</button>
        </div>
        <p class="hint">
          <button id="btn-schedule-manual" class="link-action" type="button">手动选择文件</button>
          <span>导入课表日期同上</span>
        </p>
      </div>

      <div id="schedule-stage-loading" hidden>
        <p class="import-status"><span class="spinner"></span> 正在导入课表，请稍候…</p>
      </div>

      <div id="schedule-stage-result" hidden>
        <p id="schedule-result-text" class="schedule-result"></p>
        <div class="modal-actions">
          <button id="btn-schedule-result" class="btn btn-primary" type="button">完成</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
